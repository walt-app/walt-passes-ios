name: Full CI (macOS)

# FULL tier (macOS): safety net, never a pre-merge gate — the kernel can't compile
# on the cheap Linux runners. Runs on weekly cron, manual dispatch, push to main,
# and the `full-ci` label. The label RUNS this for a signal; merges are manual
# (ci.yml is check-only), so hold the merge until this is green to gate.
#
# The 10x macOS minute multiplier does NOT apply while this repo is public —
# standard runners bill nothing here — so iterating against this runner is cheap.
# That changes if the repo ever goes private.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — main safety-net sweep
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "**/Package.swift"
      - "Package.resolved"
  pull_request:
    types: [labeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (macOS)
    # Run for cron/dispatch/push always; for a PR only when labeled `full-ci`.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'full-ci'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: |
          swift build \
            --package-path .

      - name: Test
        run: |
          swift test \
            --package-path .

  # The cron sweep has no PR to turn red, so a failure surfaced nowhere and main sat
  # broken for a week (ipass-42i). File an issue instead of failing silently.
  alert-on-cron-failure:
    name: Alert on cron failure
    needs: build-and-test
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the sweep-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          gh label create ci-sweep-failure \
            --repo "$REPO" \
            --color B60205 \
            --description "The scheduled full-ci sweep on main is failing" \
            2>/dev/null || true

          body=$(cat <<EOF
          The scheduled \`full-ci\` sweep failed on \`main\`.

          - Run: $RUN_URL
          - Commit: \`$GITHUB_SHA\`

          Filed automatically so a red macOS gate cannot go unnoticed (ipass-42i).
          Close this once the sweep is green again.
          EOF
          )

          existing=$(gh issue list --repo "$REPO" --state open \
            --label ci-sweep-failure --limit 1 --json number --jq '.[0].number // empty')

          # Comment on the standing issue rather than filing a new one each Monday.
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" \
              --title "full-ci (macOS) cron sweep is failing on main" \
              --label ci-sweep-failure \
              --body "$body"
          fi
